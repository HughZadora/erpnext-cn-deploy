name: Repository Baseline

on:
  pull_request:
  push:
    # Cover both default-branch names used across these repositories, so a
    # repository whose default branch is master still runs the baseline after
    # merge.
    branches: [main, master]
  # Kept so a repository can call this workflow locally from another workflow.
  # Cross-repository reuse is not used: the canon repository is private, and a
  # public repository cannot call a private repository's reusable workflow.
  workflow_call:

# Deliberately no concurrency group. This workflow is triggered directly by
# branch pushes and pull requests and is also called by the pull request
# workflow, and the runs share github.ref. A cancel-in-progress group would
# therefore cancel this workflow's own run, which the pull request then reports
# as a failed check.
permissions:
  contents: read

jobs:
  repository-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run repository baseline check
        run: ./scripts/repository-check
      - name: Run declared project validation
        run: |
          command=$(sed -n 's/^validation:[[:space:]]*//p' project.yaml \
            | head -1)
          if [ -n "$command" ]; then
            printf 'running declared validation: %s\n' "$command"
            sh -c "$command"
          else
            printf 'no validation command declared in project.yaml\n'
          fi
      - name: Run template behavior tests
        if: hashFiles('tests/run.sh') != ''
        run: ./tests/run.sh
