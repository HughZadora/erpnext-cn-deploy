name: 文档或维护建议
description: 建议改进本仓库的中文部署资料、示例或维护体验
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        本表单用于本仓库的文档与维护建议。新增内容应保持中文用户定位、以 frappe_docker 等上游机制为优先，并避免未经验证的生产操作建议。

        请勿提交密码、令牌、`.env`、客户资料、备份、私有域名或私有 IP。涉及安全漏洞时，请使用 [SECURITY.md](https://github.com/HughZadora/erpnext-cn-deploy/blob/main/SECURITY.md) 中的私密报告渠道。
  - type: dropdown
    id: area
    attributes:
      label: 建议涉及的范围
      options:
        - 部署或运维文档
        - 示例或仓库配置
        - 贡献与维护体验
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述当前遇到的困难或读者需求。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望变化；如涉及上游行为，请附上上游文档链接而非未经验证的生产命令。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 使用场景或相关文档（可选）
      description: 只填写非敏感场景信息；不要包含客户资料、凭据或私有网络地址。
    validations:
      required: false
