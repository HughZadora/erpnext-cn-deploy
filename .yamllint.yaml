# YAML lint policy for every repository.
#
# This file exists so the YAML linter enforces the line length and comment
# conventions declared in STANDARD.md and .editorconfig, instead of its own
# defaults (80 columns, two spaces before an inline comment). Without it a
# conformant file is reported as a violation.
extends: default

rules:
  # The standard allows 100 columns, matching .editorconfig max_line_length.
  line-length:
    max: 100

  # GitHub Actions uses `on:` as a key, which the default truthy rule reads as
  # the boolean true and rejects.
  truthy:
    check-keys: false

  # One space before an inline comment, as used by the shared workflow files
  # when recording a pinned Action version.
  comments:
    min-spaces-from-content: 1

  # The standard does not require a `---` document start marker.
  document-start: disable
